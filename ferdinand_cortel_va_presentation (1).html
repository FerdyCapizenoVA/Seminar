<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferdinand Cortel — VA | Social Media Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        matte: '#050505',
                        charcoal: '#111111',
                        accent: '#FFD800',
                        'accent-dim': '#BFA000',
                        'text-primary': '#FFFFFF',
                        'text-secondary': '#BDBDBD',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: #050505;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #FFD800; border-radius: 3px; }

        /* Grid Background */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(255,216,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,216,0,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Glow Effects */
        .glow-yellow {
            box-shadow: 0 0 20px rgba(255,216,0,0.15), 0 0 40px rgba(255,216,0,0.05);
        }
        .glow-yellow-strong {
            box-shadow: 0 0 30px rgba(255,216,0,0.3), 0 0 60px rgba(255,216,0,0.1);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(255,216,0,0.4);
        }

        /* Glassmorphism */
        .glass {
            background: rgba(17,17,17,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,216,0,0.1);
        }
        .glass-card {
            background: rgba(17,17,17,0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,216,0,0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(255,216,0,0.3);
            box-shadow: 0 0 30px rgba(255,216,0,0.1);
            transform: translateY(-4px);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes borderRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delay { animation: float 6s ease-in-out 2s infinite; }
        .animate-float-delay-2 { animation: float 6s ease-in-out 4s infinite; }
        .animate-slide-up { animation: slideUp 0.8s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.6s ease-out forwards; }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Neon Border Animation */
        .neon-border {
            position: relative;
            overflow: hidden;
        }
        .neon-border::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #FFD800, transparent, #FFD800, transparent);
            background-size: 400% 400%;
            animation: borderRotate 3s linear infinite;
            z-index: -1;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .neon-border:hover::before {
            opacity: 1;
        }

        /* Modal */
        .modal-overlay {
            background: rgba(5,5,5,0.9);
            backdrop-filter: blur(10px);
        }
        .modal-content {
            animation: scaleIn 0.3s ease-out;
        }

        /* Progress Bars */
        .progress-bar {
            background: linear-gradient(90deg, #FFD800 0%, #BFA000 100%);
            height: 100%;
            border-radius: 999px;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Particle Canvas */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 2;
        }

        /* Typing Effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: #FFD800;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Salary Counter */
        .counter-value {
            font-variant-numeric: tabular-nums;
        }

        /* Workflow Timeline */
        .timeline-line {
            background: linear-gradient(90deg, #FFD800 0%, rgba(255,216,0,0.1) 100%);
        }

        /* Card Expand */
        .niche-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .niche-card:hover {
            transform: scale(1.02);
        }

        /* Warning Cards */
        .warning-card {
            background: rgba(30,10,10,0.6);
            border: 1px solid rgba(255,50,50,0.2);
        }
        .warning-card:hover {
            border-color: rgba(255,50,50,0.4);
            box-shadow: 0 0 20px rgba(255,50,50,0.1);
        }

        /* Advantage Cards */
        .advantage-card {
            background: rgba(20,20,5,0.6);
            border: 1px solid rgba(255,216,0,0.2);
        }
        .advantage-card:hover {
            border-color: rgba(255,216,0,0.4);
            box-shadow: 0 0 20px rgba(255,216,0,0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Particle Background Component
        const ParticleBackground = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let particles = [];
                let animationId;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resize();
                window.addEventListener('resize', resize);

                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.5;
                        this.speedY = (Math.random() - 0.5) * 0.5;
                        this.opacity = Math.random() * 0.5 + 0.1;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x > canvas.width) this.x = 0;
                        if (this.x < 0) this.x = canvas.width;
                        if (this.y > canvas.height) this.y = 0;
                        if (this.y < 0) this.y = canvas.height;
                    }
                    draw() {
                        ctx.fillStyle = `rgba(255, 216, 0, ${this.opacity})`;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                for (let i = 0; i < 80; i++) {
                    particles.push(new Particle());
                }

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });

                    // Draw connections
                    particles.forEach((p1, i) => {
                        particles.slice(i + 1).forEach(p2 => {
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 150) {
                                ctx.strokeStyle = `rgba(255, 216, 0, ${0.05 * (1 - dist / 150)})`;
                                ctx.lineWidth = 0.5;
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        });
                    });

                    animationId = requestAnimationFrame(animate);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', resize);
                };
            }, []);

            return <canvas id="particles-canvas" ref={canvasRef} />;
        };

        // Navigation
        const Navigation = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { label: 'Hero', href: '#hero' },
                { label: 'Introduction', href: '#intro' },
                { label: 'What is VA', href: '#what-is-va' },
                { label: 'VA Niches', href: '#niches' },
                { label: 'Career Path', href: '#career' },
                { label: 'Tasks', href: '#tasks' },
                { label: 'Reality', href: '#reality' },
                { label: 'Payment', href: '#payment' },
                { label: 'Salary', href: '#salary' },
                { label: 'Closing', href: '#closing' },
            ];

            return (
                <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled ? 'glass py-3' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                        <a href="#hero" className="font-poppins font-bold text-xl tracking-tight">
                            <span className="text-accent">F</span>erdinand <span className="text-accent">C</span>ortel
                        </a>

                        <div className="hidden lg:flex items-center gap-8">
                            {navLinks.map(link => (
                                <a key={link.href} href={link.href} className="text-sm text-text-secondary hover:text-accent transition-colors duration-300 font-medium">
                                    {link.label}
                                </a>
                            ))}
                        </div>

                        <button 
                            className="lg:hidden text-white"
                            onClick={() => setMobileOpen(!mobileOpen)}
                        >
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                {mobileOpen ? (
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                ) : (
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                )}
                            </svg>
                        </button>
                    </div>

                    {mobileOpen && (
                        <div className="lg:hidden glass mt-2 mx-4 rounded-2xl p-4 animate-scale-in">
                            {navLinks.map(link => (
                                <a 
                                    key={link.href} 
                                    href={link.href} 
                                    className="block py-3 px-4 text-text-secondary hover:text-accent hover:bg-white/5 rounded-lg transition-all"
                                    onClick={() => setMobileOpen(false)}
                                >
                                    {link.label}
                                </a>
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        // Hero Section
        const HeroSection = () => {
            const [counters, setCounters] = useState({ industry: 0, remote: 0, careers: 0 });

            useEffect(() => {
                const duration = 2000;
                const steps = 60;
                const interval = duration / steps;
                let step = 0;

                const timer = setInterval(() => {
                    step++;
                    const progress = step / steps;
                    const easeOut = 1 - Math.pow(1 - progress, 3);

                    setCounters({
                        industry: Math.floor(25 * easeOut),
                        remote: Math.floor(100 * easeOut),
                        careers: Math.floor(50 * easeOut),
                    });

                    if (step >= steps) clearInterval(timer);
                }, interval);

                return () => clearInterval(timer);
            }, []);

            return (
                <section id="hero" className="min-h-screen flex items-center relative grid-bg pt-20">
                    <div className="max-w-7xl mx-auto px-6 py-20 w-full">
                        <div className="grid lg:grid-cols-2 gap-12 items-center">
                            <div className="animate-slide-up">
                                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass border-accent/20 mb-8">
                                    <span className="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                                    <span className="text-sm font-medium text-accent">Ferdinand Cortel — VA | Social Media Manager | Digital Professional</span>
                                </div>

                                <h1 className="font-poppins font-black text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-tight mb-6">
                                    CAREER PATHWAYS IN <br />
                                    <span className="text-accent text-glow">VIRTUAL ASSISTANCE</span><br />
                                    FOR IT/CS GRADUATES
                                </h1>

                                <p className="text-text-secondary text-lg md:text-xl leading-relaxed mb-10 max-w-2xl">
                                    How Filipino IT & CS Students Can Build Global Careers Through Virtual Assistance, Freelancing, Tech Support, Automation, Social Media Management, and AI-Powered Services.
                                </p>

                                <div className="flex flex-wrap gap-4">
                                    <a href="#niches" className="px-8 py-4 bg-accent text-matte font-bold rounded-full hover:bg-accent-dim transition-all duration-300 hover:scale-105 glow-yellow-strong">
                                        View Seminar Topics
                                    </a>
                                    <a href="#niches" className="px-8 py-4 glass text-white font-bold rounded-full hover:border-accent/40 transition-all duration-300 hover:scale-105">
                                        Explore VA Niches
                                    </a>
                                </div>
                            </div>

                            <div className="relative hidden lg:block">
                                <div className="relative w-full aspect-square max-w-lg mx-auto">
                                    {/* Floating Elements */}
                                    <div className="absolute top-10 right-10 glass-card p-4 rounded-2xl animate-float z-10">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center">
                                                <svg className="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                                                </svg>
                                            </div>
                                            <div>
                                                <div className="text-2xl font-bold text-accent">${counters.industry}B</div>
                                                <div className="text-xs text-text-secondary">Global VA Industry</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="absolute bottom-20 left-0 glass-card p-4 rounded-2xl animate-float-delay z-10">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center">
                                                <svg className="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064" />
                                                </svg>
                                            </div>
                                            <div>
                                                <div className="text-2xl font-bold text-accent">{counters.remote}%</div>
                                                <div className="text-xs text-text-secondary">Remote Global Opportunities</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="absolute top-1/2 right-0 glass-card p-4 rounded-2xl animate-float-delay-2 z-10">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center">
                                                <svg className="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                            </div>
                                            <div>
                                                <div className="text-2xl font-bold text-accent">{counters.careers}K+</div>
                                                <div className="text-xs text-text-secondary">High-Income Digital Careers</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Central Visual */}
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <div className="w-64 h-64 md:w-80 md:h-80 rounded-full border-2 border-accent/20 relative animate-pulse-glow">
                                            <div className="absolute inset-4 rounded-full border border-accent/10"></div>
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <div className="w-48 h-48 rounded-2xl glass glow-yellow flex items-center justify-center">
                                                    <svg className="w-24 h-24 text-accent/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                                    </svg>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Scroll Indicator */}
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce">
                        <svg className="w-6 h-6 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                        </svg>
                    </div>
                </section>
            );
        };

        // Intro / Hook Section
        const IntroSection = () => {
            const questions = [
                "What is a Virtual Assistant?",
                "Can IT/CS students succeed in freelancing?",
                "Can remote work become a real career?"
            ];

            return (
                <section id="intro" className="py-24 relative">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="text-center mb-16 reveal">
                            <h2 className="font-poppins font-bold text-3xl md:text-5xl mb-4">The Digital Career Revolution</h2>
                            <div className="w-24 h-1 bg-accent mx-auto rounded-full"></div>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 mb-16">
                            {questions.map((q, i) => (
                                <div key={i} className="glass-card p-8 rounded-3xl reveal" style={{transitionDelay: `${i * 150}ms`}}>
                                    <div className="w-12 h-12 rounded-2xl bg-accent/10 flex items-center justify-center mb-6">
                                        <span className="text-accent font-bold text-xl">0{i + 1}</span>
                                    </div>
                                    <h3 className="font-space text-xl font-semibold mb-2">{q}</h3>
                                    <div className="w-12 h-0.5 bg-accent/30 mt-4"></div>
                                </div>
                            ))}
                        </div>

                        <div className="glass-card p-8 md:p-12 rounded-3xl reveal border-accent/30 glow-yellow">
                            <div className="flex items-start gap-6">
                                <div className="hidden md:flex w-16 h-16 rounded-2xl bg-accent/20 items-center justify-center flex-shrink-0">
                                    <svg className="w-8 h-8 text-accent" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
                                    </svg>
                                </div>
                                <div>
                                    <p className="font-poppins text-xl md:text-2xl lg:text-3xl font-medium leading-relaxed text-white">
                                        "Everything you are studying right now is already a <span className="text-accent font-bold">competitive advantage</span> in the global digital economy."
                                    </p>
                                    <div className="mt-6 flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-full bg-accent/20"></div>
                                        <div>
                                            <div className="font-semibold">Ferdinand Cortel</div>
                                            <div className="text-sm text-text-secondary">VA & Social Media Manager</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // What is VA Section
        const WhatIsVASection = () => {
            const features = [
                {
                    icon: (
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064" />
                        </svg>
                    ),
                    title: "Remote Work",
                    desc: "Work from anywhere with an internet connection. No commute, no office politics, just pure productivity."
                },
                {
                    icon: (
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    ),
                    title: "Digital Services",
                    desc: "Provide technical, creative, and administrative services through digital platforms and cloud-based tools."
                },
